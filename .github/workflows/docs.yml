name: Publish documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - ".env.public"
      - ".github/workflows/docs.yml"
      - "index.html"
      - "package*.json"
      - "public/**"
      - "scripts/copyMathliveFonts.mjs"
      - "src/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build Try It application
        run: npm run build:try

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict --config-file docs/mkdocs.yml

      - name: Add Try It application to Pages site
        run: |
          mkdir -p docs/site/try
          cp -R dist/. docs/site/try/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
