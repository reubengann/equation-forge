- version: 1
  name: toggle delimiter style to square brackets
  tags: [delimiter, ui]
  initial:
    latex: "a + \\left(b + c\\right)"
  steps:
    - name: select group
      select:
        kind: node
        path: [2]
      action: { type: toggleDelimiterStyle }
      expect:
        latex: "a + \\left[b + c\\right]"

- version: 1
  name: toggle delimiter style back to parentheses
  tags: [delimiter, ui]
  initial:
    latex: "a + \\left[b + c\\right]"
  steps:
    - name: select group
      select:
        kind: node
        path: [2]
      action: { type: toggleDelimiterStyle }
      expect:
        latex: "a + \\left(b + c\\right)"
