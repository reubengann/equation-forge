scenarios:
  - version: 1
    name: Flip basic equation
    tags: [equation, flip]
    initial:
      latex: "x = y"
    steps:
      - name: flip sides
        action: flip
        expect:
          latex: "y = x"
  - version: 1
    name: Flip and flip back
    tags: [equation, flip]
    initial:
      latex: "a = b"
    steps:
      - name: flip once
        action: flip
        expect:
          latex: "b = a"
      - name: flip again
        action: flip
        expect:
          latex: "a = b"
