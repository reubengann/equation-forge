scenarios:
  - version: 1
    name: Issue 1 - cannot move Delta t into fraction
    tags: [issue, move, fraction]
    initial:
      latex: "x_{n+1} = x_{n} + \\frac{\\left(a + b\\right)}{2} \\Delta t"
    steps:
      - name: attempt to move Delta t into fraction numerator
        select:
          kind: node
          path: [2, 2, 2]
        action:
          type: move
          hover:
            path: [2, 2, 1, 1]
          targetSlot: 2
          mode: additive
  - version: 1
    name: Issue 1 diagnostic - multiplicative merge succeeds
    tags: [issue, move, fraction, diagnostic]
    initial:
      latex: "x_{n+1} = x_{n} + \\frac{\\left(a + b\\right)}{2} \\Delta t"
    steps:
      - name: move Delta t into fraction by multiplicative merge
        select:
          kind: node
          path: [2, 2, 2]
        action:
          type: move
          hover:
            path: [2, 2, 1]
          targetSlot: null
          mode: multiplicative
  - version: 1
    name: Issue 1 simple - additive drag into numerator
    tags: [issue, move, fraction, simple]
    initial:
      latex: "a = \\frac{b}{c} d"
    steps:
      - name: drag d into fraction numerator
        select:
          kind: node
          path: [2, 2]
        action:
          type: move
          hover:
            path: [2, 1]
          targetSlot: null
          mode: additive
  - version: 1
    name: Issue 1 simple - multiplicative before b
    tags: [issue, move, fraction, simple, multiplicative]
    initial:
      latex: "a = \\frac{b}{c} d"
    steps:
      - name: drag d to before b in numerator
        select:
          kind: node
          path: [2, 2]
        action:
          type: move
          hover:
            path: [2, 1]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "a = \\frac{d b}{c}"
  - version: 1
    name: Issue 1 simple - multiplicative after b
    tags: [issue, move, fraction, simple, multiplicative]
    initial:
      latex: "a = \\frac{b}{c} d"
    steps:
      - name: drag d to after b in numerator
        select:
          kind: node
          path: [2, 2]
        action:
          type: move
          hover:
            path: [2, 1]
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "a = \\frac{b d}{c}"
  - version: 1
    name: Issue 1 pull out from numerator
    tags: [issue, move, fraction, simple, multiplicative]
    initial:
      latex: "a = \\frac{b q}{c}"
    steps:
      - name: drag b outside fraction on left
        select:
          kind: node
          path: [2, 1, 1]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "a = b \\frac{q}{c}"
  - version: 1
    name: Delta t reorder stays atomic
    tags: [issue, move, fraction, multiplicative, delta_t]
    initial:
      latex: "a = \\frac{\\left(b + c\\right) \\Delta t}{d}"
    steps:
      - name: move delta to left of parentheses
        select:
          kind: node
          path: [2, 1, 2]
        action:
          type: move
          hover:
            path: [2, 1]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "a = \\frac{\\Delta t \\left(b + c\\right)}{d}"
  - version: 1
    name: Issue 2 - move lhs denominator b to RHS
    tags: [issue, move, equation, multiplicative]
    initial:
      latex: "\\frac{a}{b} = \\frac{\\left(c + d\\right)}{e}"
    steps:
      - name: drag b multiplicatively to RHS side root
        select:
          kind: node
          path: [1, 2]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: null
          mode: multiplicative
        expect:
          latex: "a = \\frac{\\left(c + d\\right)}{e} b"
  - version: 1
    name: Issue 3 - move b outside parentheses
    tags: [issue, move, multiplicative, delimiter]
    initial:
      latex: "c = \\left(a b\\right)"
    steps:
      - name: drag b to outside left of parenthesized product
        select:
          kind: node
          path: [2, 1, 2]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "c = b \\left(a\\right)"
  - version: 1
    name: Issue 3b - move b back into parentheses
    tags: [issue, move, multiplicative, delimiter]
    initial:
      latex: "c = b \\left(a\\right)"
    steps:
      - name: drag b into parenthesized product
        select:
          kind: node
          path: [2, 1]
        action:
          type: move
          hover:
            path: [2, 2]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "c = \\left(b a\\right)"
  - version: 1
    name: Issue 4a - move c d outside parentheses on LHS
    tags: [issue, move, multiplicative, multi, delimiter]
    initial:
      latex: "a \\left(b c d\\right) = e"
    steps:
      - name: drag c,d outside parentheses on lhs
        select:
          kind: multi
          paths:
            - [1, 2, 1, 2]
            - [1, 2, 1, 3]
        action:
          type: move
          hover:
            path: [1]
          targetSlot: 2
          mode: multiplicative
        expect:
          latex: "a \\left(b\\right) c d = e"
  - version: 1
    name: Issue 4b - move c d to RHS only
    tags: [issue, move, multiplicative, multi, equation]
    initial:
      latex: "a \\left(b c d\\right) = e"
    steps:
      - name: drag c,d to rhs
        select:
          kind: multi
          paths:
            - [1, 2, 1, 2]
            - [1, 2, 1, 3]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: null
          mode: multiplicative
        expect:
          latex: "\\frac{a \\left(b c d\\right)}{c d} = \\frac{e}{c d}"
  - version: 1
    name: Issue 5 - substitute x_2 under factor 2
    tags: [issue, substitute, precedence]
    initial:
      latex: "2 x_{2} - x_{1}"
    steps:
      - name: substitute x_2 with a+b
        select:
          kind: node
          latex: "x_{2}"
        action:
          type: substitute
          replacementLatex: "a+b"
          scope: single
        expect:
          latex: "2 \\left(a + b\\right) - x_{1}"
  - version: 1
    name: Issue 6 - apply both sides multiplies full RHS sum
    tags: [issue, equation, apply, distributive]
    initial:
      latex: "a = b - c"
    steps:
      - name: apply multiplication by d to both sides
        action:
          type: applyToBothSides
          operationLatex: "eqn*d"
        expect:
          latex: "a d = b d - c d"
  - version: 1
    name: Issue 8 - move c into left parentheses
    tags: [issue, move, additive, parentheses]
    initial:
      latex: "\\left(a + b\\right) - \\left(c + d\\right) = e"
    steps:
      - name: move c additively into left group
        select:
          kind: node
          latex: "c"
        action:
          type: move
          hover:
            latex: "a + b"
          targetSlot: 2
          mode: additive
        expect:
          latex: "\\left(a + b - c\\right) - \\left(d\\right) = e"
  - version: 1
    name: Issue 9 - substitute supports multi-selection
    tags: [issue, substitute, multi]
    initial:
      latex: "\\left(a - c + b\\right) - \\left(d\\right) = e"
    steps:
      - name: substitute a and c with z
        select:
          kind: multi
          items:
            - latex: "a"
            - latex: "c"
        action:
          type: substitute
          replacementLatex: "z"
          scope: single
        expect:
          latex: "\\left(z - z + b\\right) - \\left(d\\right) = e"
  - version: 1
    name: Issue 9b - substitute supports span selection
    tags: [issue, substitute, span]
    initial:
      latex: "\\left(a - c + b\\right) - \\left(d\\right) = e"
    steps:
      - name: substitute first two terms in additive span with z
        select:
          kind: span
          parent:
            latex: "a - c + b"
          op: Add
          start: 0
          end: 1
        action:
          type: substitute
          replacementLatex: "z"
          scope: single
        expect:
          latex: "\\left(z + b\\right) - \\left(d\\right) = e"
  - version: 1
    name: Issue 10 - move c d e into left parentheses
    tags: [issue, move, additive, multi, parentheses]
    initial:
      latex: "\\left(a + b\\right) - \\left(c d e\\right) = f"
    steps:
      - name: move c d e additively into left group
        select:
          kind: multi
          items:
            - latex: "c"
            - latex: "d"
            - latex: "e"
        action:
          type: move
          hover:
            latex: "a + b"
          targetSlot: 2
          mode: additive
        expect:
          latex: "\\left(a + b - c d e\\right) = f"
  - version: 1
    name: Issue 11 - parse subscripted partial derivative coefficient
    tags: [issue, parse, partial]
    initial:
      latex: "du = \\left(\\dfrac{\\partial {u}}{\\partial {T}}\\right)_v \\, dT"
    steps:
      - name: flip equation after parsing
        action:
          type: flip
  - version: 1
    name: Issue 12 - prime position and atomic differentials
    tags: [issue, parse, differential, prime]
    initial:
      latex: "d'q = du + P \\, dv"
    steps:
      - name: parse and preserve differential semantics
        action:
          type: flip
        expect:
          latex: "\\mathrm{d}{u} + P \\mathrm{d}{v} = \\mathrm{d}'{q}"
  - version: 1
    name: Issue 13 - factor c d - c e within lhs sum
    tags: [issue, factor, additive]
    initial:
      latex: "\\left(a + b + c d - c e\\right) = f"
    steps:
      - name: factor last two lhs terms
        select:
          kind: span
          parent:
            latex: "a + b + c d - c e"
          op: Add
          start: 2
          end: 3
        action:
          type: factor
        expect:
          latex: "\\left(a + b + c \\left(d - e\\right)\\right) = f"
  - version: 1
    name: Issue 13b - factor with multi-selection terms
    tags: [issue, factor, multi]
    initial:
      latex: "\\left(a + b + c d - c e\\right) = f"
    steps:
      - name: factor selected cd and ce terms
        select:
          kind: multi
          items:
            - latex: "c d"
            - latex: "c e"
        action:
          type: factor
        expect:
          latex: "\\left(a + b + c \\left(d - e\\right)\\right) = f"
  - version: 1
    name: Issue 14 - substitute contiguous multi product as one term
    tags: [issue, substitute, multi, product]
    initial:
      latex: "a = b c + \\left[d + e\\right] f"
    steps:
      - name: substitute [d+e] and f selection with 0 once
        select:
          kind: multi
          items:
            - latex: "\\left[d + e\\right]"
            - latex: "f"
        action:
          type: substitute
          replacementLatex: "0"
          scope: single
        expect:
          latex: "a = b c + 0"
  - version: 1
    name: Issue 15 - additive move out of numerator keeps denominator
    tags: [issue, move, additive, fraction]
    initial:
      latex: "a = \\frac{b c + \\left[\\left(d + e\\right)\\right] f}{g}"
    steps:
      - name: move b c out of fraction additively
        select:
          kind: node
          path: [2, 1, 1]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 1
          mode: additive
        expect:
          latex: "a = \\frac{\\left[\\left(d + e\\right)\\right] f}{g} + \\frac{b c}{g}"
  - version: 1
    name: Issue 16a - pull e outside fraction multiplicatively
    tags: [issue, move, multiplicative, fraction]
    initial:
      latex: "a = b + \\frac{\\left[c + d\\right] e}{f}"
    steps:
      - name: move e to right of fraction term
        select:
          kind: node
          path: [2, 2, 1, 2]
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "a = b + \\frac{\\left[c + d\\right]}{f} e"
  - version: 1
    name: Issue 16b - pull denominator outside as reciprocal
    tags: [issue, move, multiplicative, fraction]
    initial:
      latex: "a = b + \\frac{\\left[c + d\\right] e}{f}"
    steps:
      - name: move denominator f outside fraction
        select:
          kind: node
          path: [2, 2, 2]
        action:
          type: move
          hover:
            path: [2, 2]
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "a = b + \\left[c + d\\right] e \\frac{1}{f}"
  - version: 1
    name: Issue 16c - pull d v_P outside thermodynamics fraction
    tags: [issue, move, multiplicative, fraction, differential]
    initial:
      latex: "c_{P} = c_{V} + \\frac{\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\mathrm{d}{v}_{P}}{\\mathrm{d}{T}_{P}}"
    steps:
      - name: move d v_P to right of fraction term
        select:
          kind: node
          latex: "\\mathrm{d}{v_{P}}"
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "c_{P} = c_{V} + \\frac{\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]}{\\mathrm{d}{T_{P}}} \\mathrm{d}{v_{P}}"
  - version: 1
    name: Issue 16d - pull denominator d T_P outside thermodynamics fraction
    tags: [issue, move, multiplicative, fraction, differential]
    initial:
      latex: "c_{P} = c_{V} + \\frac{\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\mathrm{d}{v}_{P}}{\\mathrm{d}{T}_{P}}"
    steps:
      - name: move denominator d T_P to right of fraction term
        select:
          kind: node
          latex: "\\mathrm{d}{T_{P}}"
        action:
          type: move
          hover:
            path: [2]
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "c_{P} = c_{V} + \\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\mathrm{d}{v_{P}} \\frac{1}{\\mathrm{d}{T_{P}}}"
  - version: 1
    name: Issue 16e - pull denominator directly onto sibling factor
    tags: [issue, move, multiplicative, fraction]
    initial:
      latex: "a = b + \\frac{\\left[c + d\\right]}{e} f"
    steps:
      - name: drag e onto f to form f/e
        select:
          kind: node
          latex: "e"
        action:
          type: moveReplay
          mode: multiplicative
          fixture: "captured/issue16e-e-onto-f.json"
          expectPlanKind: "PullOutOfFraction"
        expect:
          latex: "a = b + \\left[c + d\\right] \\frac{f}{e}"
  - version: 1
    name: Issue 16f - pull d T_P onto d v_P
    tags: [issue, move, multiplicative, fraction, differential]
    initial:
      latex: "c_{P} = c_{V} + \\frac{\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]}{\\mathrm{d}{T}_{P}} \\mathrm{d}{v}_{P}"
    steps:
      - name: drag d T_P onto d v_P
        select:
          kind: node
          latex: "\\mathrm{d}{T_{P}}"
        action:
          type: moveReplay
          mode: multiplicative
          fixture: "captured/issue16f-dtp-onto-dvp.json"
          expectPlanKind: "PullOutOfFraction"
        expect:
          latex: "c_{P} = c_{V} + \\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\frac{\\mathrm{d}{v_{P}}}{\\mathrm{d}{T_{P}}}"
  - version: 1
    name: Issue 17 - cancel zero factor inside a sum
    tags: [issue, cancel, zero, multiplicative]
    initial:
      latex: "a + b 0"
    steps:
      - name: cancel zero factor in product term
        select:
          kind: node
          latex: "0"
        action:
          type: cancel
        expect:
          latex: "a"
  - version: 1
    name: Issue 17b - cancel zero product with b and 0 selected
    tags: [issue, cancel, zero, multiplicative, multi]
    initial:
      latex: "a + b 0"
    steps:
      - name: cancel with b and 0 multi-selection
        select:
          kind: multi
          items:
            - latex: "b"
            - latex: "0"
        action:
          type: cancel
        expect:
          latex: "a"
  - version: 1
    name: Issue 18 - expand on bracketed partial expression is safely rejected
    tags: [issue, expand, partial, differential]
    initial:
      latex: "\\mathrm{d}'{q} = \\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\mathrm{d}{v}"
    steps:
      - name: expand inner bracket expression
        select:
          kind: node
          path: [2, 1, 1]
        action:
          type: expand
        expectError: "no change"
  - version: 1
    name: Issue 18b - expand full RHS distributes d v
    tags: [issue, expand, partial, differential]
    initial:
      latex: "\\mathrm{d}'{q} = \\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right] \\mathrm{d}{v}"
    steps:
      - name: expand full rhs product
        select:
          kind: node
          path: [2]
        action:
          type: expand
        expect:
          latex: "\\mathrm{d}'{q} = \\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} \\mathrm{d}{v} + P \\mathrm{d}{v}"
  - version: 1
    name: Issue 18 - pull c_V outside LHS fraction
    tags: [issue, move, multiplicative, fraction, differential]
    initial:
      latex: "\\frac{c_{V} \\mathrm{d}{T}}{\\mathrm{d}{v}} = -\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]"
    steps:
      - name: move c_V to left of lhs fraction
        select:
          kind: node
          latex: "c_{V}"
        action:
          type: move
          hover:
            path: [1]
          targetSlot: 0
          mode: multiplicative
        expect:
          latex: "c_{V} \\frac{\\mathrm{d}{T}}{\\mathrm{d}{v}} = -\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]"
  - version: 1
    name: Issue 19 - expand bracket under negation
    tags: [issue, expand, negate, partial]
    initial:
      latex: "c_{V} \\frac{\\mathrm{d}{T}}{\\mathrm{d}{v}} = -\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]"
    steps:
      - name: expand selected bracket under minus
        select:
          kind: node
          latex: "\\left[\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} + P\\right]"
        action:
          type: expand
        expect:
          latex: "c_{V} \\frac{\\mathrm{d}{T}}{\\mathrm{d}{v}} = -\\left(\\frac{\\partial{u}}{\\partial{v}}\\right)_{T} - P"
  - version: 1
    name: Issue 20 - differential expansion after d(eqn)
    tags: [issue, apply, expand, differential]
    initial:
      latex: "h = u + P v"
    steps:
      - name: apply differential operator to both sides
        action:
          type: applyToBothSides
          operationLatex: "d(eqn)"
      - name: expand rhs differential
        select:
          kind: node
          path: [2]
        action:
          type: expand
        expect:
          latex: "\\mathrm{d}{h} = \\mathrm{d}{u} + \\mathrm{d}{P} v + P \\mathrm{d}{v}"
  - version: 1
    name: Issue 24 - factor latter two differential terms
    tags: [issue, factor, differential, additive]
    initial:
      latex: "\\mathrm{d}'{q} = \\left(\\frac{\\partial{h}}{\\partial{T}}\\right)_{P} \\mathrm{d}{T} + \\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} \\mathrm{d}{P} - \\mathrm{d}{P} v"
    steps:
      - name: factor selected latter two terms on rhs
        select:
          kind: span
          parent:
            path: [2]
          op: Add
          start: 1
          end: 2
        action:
          type: factor
        expect:
          latex: "\\mathrm{d}'{q} = \\left(\\frac{\\partial{h}}{\\partial{T}}\\right)_{P} \\mathrm{d}{T} + \\mathrm{d}{P} \\left(\\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} - v\\right)"
  - version: 1
    name: Issue 24b - factor latter two terms via multi-selection
    tags: [issue, factor, differential, multi]
    initial:
      latex: "\\mathrm{d}'{q} = \\left(\\frac{\\partial{h}}{\\partial{T}}\\right)_{P} \\mathrm{d}{T} + \\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} \\mathrm{d}{P} - \\mathrm{d}{P} v"
    steps:
      - name: factor latter terms from multi-selection
        select:
          kind: multi
          items:
            - path: [2, 2]
            - path: [2, 3, 1]
        action:
          type: factor
        expect:
          latex: "\\mathrm{d}'{q} = \\left(\\frac{\\partial{h}}{\\partial{T}}\\right)_{P} \\mathrm{d}{T} + \\mathrm{d}{P} \\left(\\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} - v\\right)"
  - version: 1
    name: Issue 25 - move dT across equation onto dP
    tags: [issue, move, multiplicative, differential, equation]
    initial:
      latex: "c_{P} \\mathrm{d}{T} - c_{v} \\mathrm{d}{T} = -\\left[\\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} - v\\right] \\mathrm{d}{P}"
    steps:
      - name: drag dT onto dP to divide both sides
        select:
          kind: node
          latex: "\\mathrm{d}{T}"
        action:
          type: move
          hover:
            latex: "\\mathrm{d}{P}"
          targetSlot: 1
          mode: multiplicative
        expect:
          latex: "c_{P} - c_{v} = -\\left[\\left(\\frac{\\partial{h}}{\\partial{P}}\\right)_{T} - v\\right] \\frac{\\mathrm{d}{P}}{\\mathrm{d}{T}}"
  - version: 1
    name: Issue 100 - reorder duplicate additive log terms
    tags: [issue, move, additive, logs]
    initial:
      latex: "\\Delta S = c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) - c_{P} m \\ln\\left(T_{1}\\right) + c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) - c_{P} m \\ln\\left(T_{2}\\right)"
    steps:
      - name: drag first log term to right of duplicate
        select:
          kind: node
          path: [2, 1]
        action:
          type: move
          hover:
            path: [2, 3]
          targetSlot: 1
          mode: additive
        expect:
          latex: "\\Delta S = -c_{P} m \\ln\\left(T_{1}\\right) + c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) + c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) - c_{P} m \\ln\\left(T_{2}\\right)"
  - version: 1
    name: Issue 101 - simplify duplicate additive log terms from descendant picks
    tags: [issue, simplify, additive, selection]
    initial:
      latex: "\\Delta S = c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) + c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) - c_{P} m \\ln\\left(T_{1}\\right) - c_{P} m \\ln\\left(T_{2}\\right)"
    steps:
      - name: simplify with multi-selection on descendants inside first two additive terms
        select:
          kind: multi
          items:
            - path: [2, 1, 1]
            - path: [2, 2, 3]
        action:
          type: simplify
        expect:
          latex: "\\Delta S = 2 c_{P} m \\ln\\left(\\frac{1}{2} \\left(T_{1} + T_{2}\\right)\\right) - c_{P} m \\ln\\left(T_{1}\\right) - c_{P} m \\ln\\left(T_{2}\\right)"
  - version: 1
    name: Issue 102 - move denominator factor to reciprocal lhs right edge
    tags: [issue, move, multiplicative, denominator]
    initial:
      latex: "\\frac{1}{T_{h} - T_{c}} = \\frac{Q_{h2}}{\\left(Q_{h2} - Q_{c}\\right) T_{h}}"
    steps:
      - name: drag rhs denominator T_h to right edge of lhs fraction
