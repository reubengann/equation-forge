site_name: Equation Forge
site_description: Formula derivation by direct manipulation
site_url: https://reubengann.github.io/equation-forge/
repo_url: https://github.com/reubengann/equation-forge
repo_name: reubengann/equation-forge

nav:
  - Home: index.md
  - Try it: https://reubengann.github.io/equation-forge/try/
  - Getting started: getting-started.md
  - Tutorials:
      - Learning path: tutorials/index.md
      - First derivation: tutorial.md
      - Core workflows:
          - Selection and rearranging: tutorials/selection-and-rearranging.md
          - Distribute and factor: tutorials/distribute-and-factor.md
          - Substitution: tutorials/substitution.md
          - Operations, identities, and evaluation: tutorials/operations-identities-and-evaluation.md
      - Worked derivations:
          - Pythagorean theorem: tutorials/pythagorean-theorem.md
          - Enthalpy from an equation of state: tutorials/enthalpy-from-equation-of-state.md
          - Carnot reservoirs: tutorials/carnot-reservoirs.md
  - Concepts: concepts.md
  - Rewrite features: rewrite-features.md
  - Keyboard shortcuts: keyboard-shortcuts.md
  - FAQ: faq.md

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
